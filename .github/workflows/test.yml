name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  client:
    name: client bundle (render + slot wiring)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # React is installed into its OWN directory on purpose. Installing it in
      # the plugin root would make npm resolve this package's peerDependencies
      # too, and `@deepseek-ai/cordis` lives on the DSH install, not on the
      # public registry — the install would hang or fail for a reason that has
      # nothing to do with what this job tests.
      - name: Install react for the render harness
        run: |
          mkdir -p "$RUNNER_TEMP/reactenv"
          cd "$RUNNER_TEMP/reactenv"
          npm init -y >/dev/null
          npm install --no-audit --no-fund react@18 react-dom@18

      - name: Render every registered component
        env:
          GLM_PROFILE_NODE_MODULES: ${{ runner.temp }}/reactenv/node_modules/..
        run: node test/client.test.mjs

  host:
    name: host routes (live upstream)
    runs-on: ubuntu-latest
    # Needs a real Coding Plan key: the suite reads the live quota endpoint, so
    # a fork's pull request (which cannot see secrets) skips rather than fails.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check for a configured key
        id: key
        env:
          GLM_TEST_KEY: ${{ secrets.GLM_TEST_KEY }}
        run: |
          if [ -z "$GLM_TEST_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GLM_TEST_KEY is not set; skipping the live upstream suite. Add a Coding Plan key under Settings > Secrets to run it."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Routes, auth, key resolution, error classification
        if: steps.key.outputs.present == 'true'
        env:
          GLM_TEST_KEY: ${{ secrets.GLM_TEST_KEY }}
          GLM_TEST_DIR: ${{ runner.temp }}/glm-usage-test
        run: node test/host.test.mjs
